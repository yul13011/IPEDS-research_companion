<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 776" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>IPEDS Research Companion request flow</title>
<desc>A question is resolved for intent by Haiku (escalating to Sonnet on retry), then planned by either a deterministic reviewed-measures route or a Sonnet catalog-planner loop. The plan passes gate 1 (catalog binding: every ID is real) then gate 2 (semantic check: valid and safe to run), a bounded read-only query runs, and Sonnet summarizes the results in natural language before the answer. The resolver can clarify, with a reply looping back; refusal is terminal, and either gate can block. Purple steps use an LLM; teal steps are deterministic.</desc>
<style>
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.b-gray{fill:#F1EFE8;stroke:#5F5E5A}
.b-purple{fill:#EEEDFE;stroke:#534AB7}
.b-teal{fill:#E1F5EE;stroke:#0F6E56}
.b-coral{fill:#FAECE7;stroke:#993C1D}
.t-gray{fill:#2C2C2A}.s-gray{fill:#5F5E5A}
.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}
.t-teal{fill:#085041}.s-teal{fill:#0F6E56}
.t-coral{fill:#712B13}.s-coral{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="776" fill="#ffffff"/>

<rect class="b-gray" x="190" y="24" width="160" height="46" rx="8" stroke-width="0.5"/>
<text class="th t-gray" x="270" y="47" text-anchor="middle" dominant-baseline="central">Question</text>

<rect class="b-purple" x="170" y="98" width="200" height="58" rx="8" stroke-width="0.5"/>
<text class="th t-purple" x="270" y="115" text-anchor="middle" dominant-baseline="central">Resolve intent</text>
<text class="ts s-purple" x="270" y="136" text-anchor="middle" dominant-baseline="central">Haiku &#8594; Sonnet &#183; LLM</text>

<rect class="b-teal" x="40" y="196" width="236" height="70" rx="8" stroke-width="0.5"/>
<text class="th t-teal" x="158" y="213" text-anchor="middle" dominant-baseline="central">Reviewed measures</text>
<text class="ts s-teal" x="158" y="233" text-anchor="middle" dominant-baseline="central">map to a pre-built SQL route</text>
<text class="ts s-teal" x="158" y="249" text-anchor="middle" dominant-baseline="central">no model call</text>

<rect class="b-purple" x="296" y="196" width="236" height="84" rx="8" stroke-width="0.5"/>
<text class="th t-purple" x="414" y="213" text-anchor="middle" dominant-baseline="central">Catalog planner loop</text>
<text class="ts s-purple" x="414" y="232" text-anchor="middle" dominant-baseline="central">find fields in IPEDS codebook</text>
<text class="ts s-purple" x="414" y="248" text-anchor="middle" dominant-baseline="central">build a plan</text>
<text class="ts s-purple" x="414" y="264" text-anchor="middle" dominant-baseline="central">Sonnet &#183; LLM</text>

<rect class="b-teal" x="170" y="312" width="200" height="58" rx="8" stroke-width="0.5"/>
<text class="th t-teal" x="270" y="329" text-anchor="middle" dominant-baseline="central">Gate 1 &#183; binding</text>
<text class="ts s-teal" x="270" y="350" text-anchor="middle" dominant-baseline="central">every ID is real</text>

<rect class="b-teal" x="170" y="398" width="200" height="58" rx="8" stroke-width="0.5"/>
<text class="th t-teal" x="270" y="415" text-anchor="middle" dominant-baseline="central">Gate 2 &#183; semantics</text>
<text class="ts s-teal" x="270" y="436" text-anchor="middle" dominant-baseline="central">valid &amp; safe to run</text>

<rect class="b-teal" x="170" y="484" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th t-teal" x="270" y="501" text-anchor="middle" dominant-baseline="central">Read-only query</text>
<text class="ts s-teal" x="270" y="521" text-anchor="middle" dominant-baseline="central">run the bounded query</text>
<text class="ts s-teal" x="270" y="537" text-anchor="middle" dominant-baseline="central">deterministic</text>

<rect class="b-purple" x="170" y="582" width="200" height="84" rx="8" stroke-width="0.5"/>
<text class="th t-purple" x="270" y="599" text-anchor="middle" dominant-baseline="central">Narrate</text>
<text class="ts s-purple" x="270" y="618" text-anchor="middle" dominant-baseline="central">summarize results in</text>
<text class="ts s-purple" x="270" y="634" text-anchor="middle" dominant-baseline="central">natural language</text>
<text class="ts s-purple" x="270" y="650" text-anchor="middle" dominant-baseline="central">Sonnet &#183; LLM</text>

<rect class="b-gray" x="190" y="694" width="160" height="46" rx="8" stroke-width="0.5"/>
<text class="th t-gray" x="270" y="717" text-anchor="middle" dominant-baseline="central">Answer</text>

<rect class="b-coral" x="470" y="98" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th t-coral" x="555" y="115" text-anchor="middle" dominant-baseline="central">Clarify / refuse</text>
<text class="ts s-coral" x="555" y="135" text-anchor="middle" dominant-baseline="central">resolver defers</text>
<text class="ts s-coral" x="555" y="151" text-anchor="middle" dominant-baseline="central">refuse ends here</text>

<rect class="b-coral" x="470" y="360" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th t-coral" x="555" y="377" text-anchor="middle" dominant-baseline="central">Blocked &#8212; not run</text>
<text class="ts s-coral" x="555" y="397" text-anchor="middle" dominant-baseline="central">a gate rejected it</text>
<text class="ts s-coral" x="555" y="413" text-anchor="middle" dominant-baseline="central">explains why</text>

<line x1="270" y1="70" x2="270" y2="94" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="156" x2="160" y2="192" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="156" x2="414" y2="192" class="arr" marker-end="url(#arrow)"/>
<line x1="158" y1="266" x2="232" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="414" y1="280" x2="308" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="370" x2="270" y2="394" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="456" x2="270" y2="480" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="554" x2="270" y2="578" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="666" x2="270" y2="690" class="arr" marker-end="url(#arrow)"/>
<line x1="372" y1="120" x2="466" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="ts s-coral" x="419" y="132" text-anchor="middle" dominant-baseline="central">if clarified</text>
<line x1="466" y1="142" x2="372" y2="142" marker-end="url(#arrow)" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="372" y1="340" x2="466" y2="378" class="arr" marker-end="url(#arrow)"/>
<line x1="372" y1="428" x2="466" y2="410" class="arr" marker-end="url(#arrow)"/>
</svg>
